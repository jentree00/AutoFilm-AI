<!DOCTYPE html>
<html lang="en">
<head>

  <script src="https://cdn.tailwindcss.com"></script>

<body class="bg-slate-950 flex items-center justify-center min-h-screen m-0 p-0 font-sans">
  <div class="w-full max-w-[360px] h-[640px] relative overflow-hidden rounded-[24px] shadow-2xl flex flex-col justify-between p-8 bg-gradient-to-b from-slate-900 via-indigo-950 to-slate-950 border border-slate-800">
    <div class="absolute -top-20 -left-20 w-56 h-56 bg-purple-600/20 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-20 -right-20 w-56 h-56 bg-blue-600/20 rounded-full blur-3xl"></div>

    <div class="flex-1 flex flex-col items-center justify-center text-center z-10 mt-12">
      <div class="mb-4 p-3 bg-indigo-500/10 rounded-2xl border border-indigo-500/20 shadow-inner">
        <svg class="w-8 h-8 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z" />

      <h1 class="text-4xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-200 to-indigo-300">
        AutoFilm
      </h1>
      <span class="mt-1 text-xl font-bold tracking-widest text-indigo-400 uppercase">AI</span>
    </div>

    <div class="w-full z-10 mb-10 flex flex-col items-center">
      <div class="flex items-center justify-between w-full mb-2 px-1">
        <span class="text-xs font-medium text-slate-400 tracking-wider uppercase">Loading...</span>
      </div>
      <div class="w-full h-3 bg-slate-800/80 rounded-full p-0.5 border border-slate-700/50 backdrop-blur-sm shadow-inner overflow-hidden">
        <div class="h-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 rounded-full animate-pulse w-full"></div>
      </div>
    </div>
  </div>

  <script>
    // Lilipat sa Dashboard pagkaraan ng 3 segundo
    setTimeout(() => {
      window.location.href = "dashboard.html";
    }, 3000);
  </script>

</html>
