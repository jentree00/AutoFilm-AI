<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 flex items-center justify-center min-h-screen m-0 p-0 font-sans">

  <!-- Mobile Screen Container (360x640 px) -->
  <div class="w-full max-w-[360px] h-[640px] relative overflow-hidden rounded-[24px] shadow-2xl flex flex-col justify-between p-6 text-center text-white bg-slate-900 border border-slate-800">
    
    <!-- Background Image with Overlay -->
    <div class="absolute inset-0 bg-cover bg-center z-0 scale-105" style="background-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000&auto=format&fit=crop');"></div>
    <div class="absolute inset-0 bg-gradient-to-b from-slate-950/80 via-slate-950/40 to-slate-950/90 z-0"></div>

    <!-- Top Content / Logo Area -->
    <div class="relative z-10 flex flex-col items-center mt-10">
      
      <!-- Film Play Icon -->
      <div class="w-20 h-20 mb-3 bg-gradient-to-tr from-blue-600 via-indigo-500 to-sky-400 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/30 border border-white/20">
        <svg class="w-10 h-10 text-white fill-current ml-1" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </div>

      <!-- Title: AutoFilm -->
      <h1 class="text-4xl font-extrabold tracking-tight">
        Auto<span class="text-blue-400">Film</span>
      </h1>

      <!-- Subtitle / Tagline -->
      <p class="mt-3 text-sm font-medium text-slate-200 leading-snug max-w-[220px]">
        Turn Your Ideas into<br/>Short Films Automatically
      </p>
    </div>

    <!-- Subtle Loading Bar at the bottom -->
    <div class="relative z-10 mb-4 w-full px-8 flex flex-col items-center">
      <div class="w-full h-1.5 bg-white/20 rounded-full overflow-hidden backdrop-blur-sm">
        <div class="h-full bg-blue-500 rounded-full animate-pulse w-full"></div>
      </div>
    </div>

  </div>

  <script>
    // Lilipat sa Dashboard pagkaraan ng 3 segundo
    setTimeout(() => {
      window.location.href = "dashboard.html";
    }, 3000);
  </script>
</body>
</html>
