<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 flex items-center justify-center min-h-screen m-0 p-0 font-sans">
  <div class="w-full max-w-[360px] h-[640px] relative overflow-hidden rounded-[24px] shadow-2xl flex flex-col justify-between p-5 bg-gradient-to-b from-slate-900 via-indigo-950 to-slate-950 border border-slate-800 text-white">
    <div class="absolute -top-20 -right-20 w-56 h-56 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-20 -left-20 w-56 h-56 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="flex-1 overflow-y-auto z-10 space-y-5">
      <div class="pt-2 flex justify-between items-center">
        <div>
          <span class="text-xs text-indigo-400 font-medium tracking-wide uppercase">AutoFilm AI</span>
          <h1 class="text-2xl font-bold tracking-tight text-white">Welcome!</h1>
        </div>
        <div class="w-10 h-10 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-indigo-400 font-semibold shadow-inner">AI</div>
      </div>

      <button class="w-full py-4 px-5 rounded-2xl bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold flex items-center justify-center gap-3 shadow-lg shadow-indigo-500/25 border border-indigo-400/30">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
        <span class="text-base tracking-wide">Create New Film</span>
      </button>

      <div>
        <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Quick Action</h2>
        <div class="grid grid-cols-4 gap-2">
          <button class="flex flex-col items-center justify-center p-2.5 rounded-xl bg-slate-800/60 border border-slate-700/50">
            <span class="text-[10px] font-medium text-slate-300">Script</span>
          </button>
          <button class="flex flex-col items-center justify-center p-2.5 rounded-xl bg-slate-800/60 border border-slate-700/50">
            <span class="text-[10px] font-medium text-slate-300">Voiceover</span>
          </button>
          <button class="flex flex-col items-center justify-center p-2.5 rounded-xl bg-slate-800/60 border border-slate-700/50">
            <span class="text-[10px] font-medium text-slate-300">Image</span>
          </button>
          <button class="flex flex-col items-center justify-center p-2.5 rounded-xl bg-slate-800/60 border border-slate-700/50">
            <span class="text-[10px] font-medium text-slate-300">Settings</span>
          </button>
        </div>
      </div>

      <div>
        <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Recent Projects</h2>
        <div class="space-y-2.5">
          <div class="p-3 rounded-xl bg-slate-900/80 border border-slate-800 flex items-center justify-between">
            <div>
              <h3 class="text-xs font-semibold text-slate-200">Sci-Fi Short Teaser</h3>
              <p class="text-[10px] text-slate-400">Edited 2 hours ago</p>
            </div>
            <span class="text-[10px] px-2 py-1 rounded bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">Draft</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
