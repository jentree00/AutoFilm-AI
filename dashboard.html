<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 flex items-center justify-center min-h-screen m-0 p-0 font-sans">

  <!-- Mobile Screen Container (360x640 px) -->
  <div class="w-full max-w-[360px] h-[640px] relative overflow-hidden rounded-[24px] shadow-2xl flex flex-col justify-between p-4 bg-[#0B101D] text-white border border-slate-800">
    
    <!-- Scrollable Content -->
    <div class="flex-1 overflow-y-auto no-scrollbar space-y-4 pr-0.5">
      
      <!-- Header Section -->
      <div class="flex justify-between items-center pt-2 px-1">
        <div>
          <h1 class="text-xl font-bold tracking-tight text-white">Hello, Jaymart!</h1>
          <p class="text-[11px] text-slate-400">Create amazing short films with AI</p>
        </div>
        <!-- Profile Avatar -->
        <div class="w-9 h-9 rounded-full overflow-hidden border border-slate-700 bg-slate-800">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=200&auto=format&fit=crop" alt="Profile" class="w-full h-full object-cover">
        </div>
      </div>

      <!-- Hero Banner Card -->
      <div class="relative rounded-2xl overflow-hidden border border-slate-800/80 shadow-lg">
        <!-- Background Image with Dark Overlay -->
        <div class="absolute inset-0 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=600&auto=format&fit=crop');"></div>
        <div class="absolute inset-0 bg-gradient-to-r from-slate-950/90 via-slate-950/60 to-transparent"></div>

        <!-- Banner Content -->
        <div class="relative z-10 p-4 pt-5 pb-4 max-w-[200px]">
          <h2 class="text-lg font-extrabold leading-tight tracking-wide text-white">
            Your Story<br/>Our AI
          </h2>
          <p class="text-[10px] text-slate-300 mt-2 leading-tight">
            Just give us an idea, we'll turn it into a short film.
          </p>
        </div>

        <!-- Call to Action Button inside/below Banner -->
        <div class="relative z-10 px-3 pb-3">
          <button class="w-full py-2.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white text-xs font-semibold tracking-wide shadow-md shadow-blue-500/20 active:scale-[0.99] transition">
            Create New Film
          </button>
        </div>
      </div>

      <!-- Quick Actions Grid -->
      <div>
        <h3 class="text-xs font-bold text-white mb-2.5 px-1">Quick Actions</h3>
        <div class="grid grid-cols-4 gap-2">
          
          <!-- Templates -->
          <button class="flex flex-col items-center justify-center py-3 px-1 rounded-xl bg-[#131B2E] border border-slate-800/80 hover:bg-slate-800/50 transition">
            <svg class="w-5 h-5 text-blue-400 mb-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
            </svg>
            <span class="text-[10px] font-medium text-slate-300">Templates</span>
          </button>

          <!-- My Projects -->
          <button class="flex flex-col items-center justify-center py-3 px-1 rounded-xl bg-[#131B2E] border border-slate-800/80 hover:bg-slate-800/50 transition">
            <svg class="w-5 h-5 text-blue-400 mb-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
            </svg>
            <span class="text-[10px] font-medium text-slate-300">My Projects</span>
          </button>

          <!-- Characters -->
          <button class="flex flex-col items-center justify-center py-3 px-1 rounded-xl bg-[#131B2E] border border-slate-800/80 hover:bg-slate-800/50 transition">
            <svg class="w-5 h-5 text-blue-400 mb-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            <span class="text-[10px] font-medium text-slate-300">Characters</span>
          </button>

          <!-- Settings -->
          <button class="flex flex-col items-center justify-center py-3 px-1 rounded-xl bg-[#131B2E] border border-slate-800/80 hover:bg-slate-800/50 transition">
            <svg class="w-5 h-5 text-blue-400 mb-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            </svg>
            <span class="text-[10px] font-medium text-slate-300">Settings</span>
          </button>

        </div>
      </div>

      <!-- Recent Projects Section -->
      <div>
        <div class="flex justify-between items-center mb-2.5 px-1">
          <h3 class="text-xs font-bold text-white">Recent Projects</h3>
          <a href="#" class="text-[10px] text-blue-400 font-medium hover:underline">View All &gt;</a>
        </div>

        <!-- Recent Project Card -->
        <div class="p-2.5 rounded-xl bg-[#131B2E] border border-slate-800/80 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=200&auto=format&fit=crop" class="w-12 h-12 rounded-lg object-cover border border-slate-700" alt="Thumbnail">
            <div>
              <h4 class="text-xs font-semibold text-white">The Lost Heir</h4>
              <p class="text-[10px] text-slate-400 mt-0.5">3 min • Fantasy • 2026-09-10</p>
            </div>
          </div>
          <button class="p-1.5 text-slate-400 hover:text-white">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
          </button>
        </div>
      </div>

    </div>

  </div>

</body>
</html>
