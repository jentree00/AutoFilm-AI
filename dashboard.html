<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 flex items-center justify-center min-h-screen m-0 p-0 font-sans">

  <!-- Mobile Screen Container -->
  <div class="w-full max-w-[360px] h-[640px] relative overflow-hidden rounded-[24px] shadow-2xl flex flex-col justify-between p-4 bg-[#0B101D] text-white border border-slate-800">
    
    <!-- VIEW 1: MAIN DASHBOARD -->
    <div id="mainDashboard" class="flex-1 overflow-y-auto no-scrollbar space-y-4 pr-0.5">
      <div class="flex justify-between items-center pt-2 px-1">
        <div>
          <h1 class="text-xl font-bold tracking-tight text-white">Hello, Jaymart!</h1>
          <p class="text-[11px] text-slate-400">Create amazing short films with AI</p>
        </div>
        <div class="w-9 h-9 rounded-full overflow-hidden border border-slate-700 bg-slate-800">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=200&auto=format&fit=crop" alt="Profile" class="w-full h-full object-cover">
        </div>
      </div>

      <div class="relative rounded-2xl overflow-hidden border border-slate-800/80 shadow-lg">
        <div class="absolute inset-0 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=600&auto=format&fit=crop');"></div>
        <div class="absolute inset-0 bg-gradient-to-r from-slate-950/90 via-slate-950/60 to-transparent"></div>
        <div class="relative z-10 p-4 pt-5 pb-4 max-w-[200px]">
          <h2 class="text-lg font-extrabold leading-tight tracking-wide text-white">Your Story<br/>Our AI</h2>
          <p class="text-[10px] text-slate-300 mt-2 leading-tight">Just give us an idea, we'll turn it into a short film.</p>
        </div>
        <div class="relative z-10 px-3 pb-3">
          <button onclick="openGenreModal()" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white text-xs font-semibold tracking-wide shadow-md shadow-blue-500/20 active:scale-[0.99] transition">Create New Film</button>
        </div>
      </div>

      <div>
        <h3 class="text-xs font-bold text-white mb-2.5 px-1">Quick Actions</h3>
        <div class="grid grid-cols-4 gap-2">
          <button class="flex flex-col items-center justify-center py-3 px-1 rounded-xl bg-[#131B2E] border border-slate-800/80 hover:bg-slate-800/50 transition">
            <svg class="w-5 h-5 text-blue-400 mb-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
            <span class="text-[10px] font-medium text-slate-300">Templates</span>
          </button>
          <button class="flex flex-col items-center justify-center py-3 px-1 rounded-xl bg-[#131B2E] border border-slate-800/80 hover:bg-slate-800/50 transition">
            <svg class="w-5 h-5 text-blue-400 mb-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" /></svg>
            <span class="text-[10px] font-medium text-slate-300">Projects</span>
          </button>
          <button class="flex flex-col items-center justify-center py-3 px-1 rounded-xl bg-[#131B2E] border border-slate-800/80 hover:bg-slate-800/50 transition">
            <svg class="w-5 h-5 text-blue-400 mb-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
            <span class="text-[10px] font-medium text-slate-300">Characters</span>
          </button>
          <button class="flex flex-col items-center justify-center py-3 px-1 rounded-xl bg-[#131B2E] border border-slate-800/80 hover:bg-slate-800/50 transition">
            <svg class="w-5 h-5 text-blue-400 mb-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /></svg>
            <span class="text-[10px] font-medium text-slate-300">Settings</span>
          </button>
        </div>
      </div>
    </div>

    <!-- GENRE MODAL -->
    <div id="genreModal" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex flex-col justify-end">
      <div class="bg-[#131B2E] border-t border-slate-800 rounded-t-2xl p-4 space-y-3">
        <div class="flex justify-between items-center mb-1">
          <h3 class="text-sm font-bold text-white">Pumili ng Genre</h3>
          <button onclick="closeGenreModal()" class="text-slate-400 text-xs hover:text-white">✕</button>
        </div>
        <button onclick="runGenre()" class="w-full py-2.5 px-3 rounded-xl bg-slate-900 border border-slate-700 hover:border-blue-500 text-left flex justify-between items-center">
          <div>
            <p class="text-xs font-bold text-white">👻 Horror / Thriller</p>
            <p class="text-[10px] text-slate-400">Suspense, Action, Love Story, Mystery</p>
          </div>
          <span class="text-blue-400 text-xs">➔</span>
        </button>
      </div>
    </div>

    <!-- VIEW: PHASE 1 -->
    <div id="storyConceptsView" class="hidden absolute inset-0 bg-[#0B101D] z-50 flex flex-col p-4 overflow-y-auto no-scrollbar">
      <div class="flex justify-between items-center mb-3">
        <button onclick="backToDashboard()" class="text-xs text-blue-400 font-semibold">← Back</button>
        <span class="text-[10px] bg-blue-900/50 text-blue-300 border border-blue-700/50 px-2 py-0.5 rounded-full font-mono">PHASE 1</span>
      </div>
      <div class="bg-blue-950/30 border border-blue-800/40 rounded-xl p-3 mb-4">
        <p class="text-[11px] text-blue-200 font-medium leading-relaxed">🎬 <b>Master AI Showrunner:</b> Pumili ng 1 Story Concept para sa Master Bible.</p>
      </div>
      <div id="conceptsContainer" class="space-y-3 pb-6"></div>
    </div>

    <!-- VIEW: PHASE 2 -->
    <div id="phase2View" class="hidden absolute inset-0 bg-[#0B101D] z-50 flex flex-col p-4 overflow-y-auto no-scrollbar">
      <div class="flex justify-between items-center mb-3">
        <button onclick="backToConcepts()" class="text-xs text-blue-400 font-semibold">← Concepts</button>
        <span class="text-[10px] bg-purple-900/50 text-purple-300 border border-purple-700/50 px-2 py-0.5 rounded-full font-mono">PHASE 2</span>
      </div>
      <div id="phase2Content" class="space-y-4 pb-6 text-slate-200 text-[11px]"></div>
    </div>

    <!-- VIEW: PHASE 3 -->
    <div id="phase3View" class="hidden absolute inset-0 bg-[#0B101D] z-50 flex flex-col p-4 overflow-y-auto no-scrollbar">
      <div class="flex justify-between items-center mb-3">
        <button onclick="backToPhase2()" class="text-xs text-blue-400 font-semibold">← Phase 2</button>
        <span class="text-[10px] bg-indigo-900/50 text-indigo-300 border border-indigo-700/50 px-2 py-0.5 rounded-full font-mono">PHASE 3</span>
      </div>
      <div id="phase3Content" class="space-y-4 pb-6 text-slate-200 text-[11px]"></div>
    </div>

    <!-- VIEW: PHASE 4 -->
    <div id="phase4View" class="hidden absolute inset-0 bg-[#0B101D] z-50 flex flex-col p-4 overflow-y-auto no-scrollbar">
      <div class="flex justify-between items-center mb-3">
        <button onclick="backToPhase3()" class="text-xs text-blue-400 font-semibold">← Phase 3</button>
        <span class="text-[10px] bg-emerald-900/50 text-emerald-300 border border-emerald-700/50 px-2 py-0.5 rounded-full font-mono">PHASE 4</span>
      </div>
      <div id="phase4Content" class="space-y-4 pb-6 text-slate-200 text-[11px]"></div>
    </div>

    <!-- VIEW: PHASE 5 -->
    <div id="phase5View" class="hidden absolute inset-0 bg-[#0B101D] z-50 flex flex-col p-4 overflow-y-auto no-scrollbar">
      <div class="flex justify-between items-center mb-3">
        <button onclick="backToPhase4()" class="text-xs text-blue-400 font-semibold">← Phase 4</button>
        <span class="text-[10px] bg-amber-900/50 text-amber-300 border border-amber-700/50 px-2 py-0.5 rounded-full font-mono">PHASE 5</span>
      </div>
      <div id="phase5Content" class="space-y-4 pb-6 text-slate-200 text-[11px]"></div>
    </div>

  </div>

  <script>
    let activeStory = null;

    const horrorConcepts = [
      { 
        id: 1, 
        title: "Ang Huling Habilin", 
        tag: "Psychological Horror", 
        desc: "Nakatanggap si Mark ng video message mula sa namatay niyang girlfriend: 'Huwag mong bubuksan ang pinto kapag kumatok ako ngayong gabi.'",
        logline: "Pagkatapos mamatay ng kanyang kasintahan, nakatanggap si Mark ng live video mula rito na nagbabala na huwag bubuksan ang pinto.",
        premise: "Sinusubukan ni Mark na alalamin kung ang bumalik na si Clara ay ang kanyang tunay na mahal o isang mapanlinlang na entidad.",
        mystery: "Bakit ginagamit ng sinaunang nilalang ang anyo ni Clara para makuha ang kaluluwa ni Mark?",
        charName: "Mark_MasterRef_v1",
        charPrompt: "25-year-old Filipino male, realistic skin texture, short neat black hair, worried dark brown eyes, wearing black hoodie, photorealistic, 9:16 vertical.",
        roadmap: [
          { ep: 1, title: "The Live Stream", rev: "Namatay na si Clara 3 days ago", cliff: "May kumakatok sa pinto" },
          { ep: 2, title: "The Shadow", rev: "May nawawalang diary", cliff: "Nasa loob na ang entidad" },
          { ep: 3, title: "The Impostor", rev: "Isinakripisyo si Clara ng pamilya", cliff: "Hinawakan ni Clara ang leeg ni Mark" },
          { ep: 4, title: "The Ritual", rev: "Maiiwasan ang sumpa gamit ang dugo", cliff: "Lumabas ang tunay na halimaw" },
          { ep: 5, title: "The Final Choice", rev: "Kaluluwa ni Clara ay gising pa", cliff: "Kumawala sa sumpa" }
        ],
        scenes: [
          { ep: 1, s: 1, title: "The Notification", desc: "Tumunog ang telepono sa kalagitnaan ng gabi. Lumabas ang pangalan ng pumanaw na kasintahan." },
          { ep: 1, s: 2, title: "The Video Message", desc: "Lumabas si Clara sa video na sinasabing: 'Huwag mong bubuksan ang pinto!'." },
          { ep: 1, s: 3, title: "The Knock", desc: "Namatay ang mga ilaw at may malakas na kumakatok sa pinto." },
          { ep: 2, s: 1, title: "The Search", desc: "Paghahanap sa lumang gamit at diary sa kwarto habang may kumakaluskos." },
          { ep: 2, s: 2, title: "The Mirror Reveal", desc: "Nakita ang anino sa salamin ngunit walang tao sa likod." },
          { ep: 2, s: 3, title: "Breached", desc: "Bumukas ang pinto nang kusa. Pumasok ang mausok na anino." },
          { ep: 3, s: 1, title: "The Reunion", desc: "Paghaharap kay Clara. Kamukha niya ito ngunit iba ang boses." },
          { ep: 3, s: 2, title: "The Dark Secret", desc: "Naalaala ni Mark ang lihim na kasunduan ng pamilya ni Clara." },
          { ep: 3, s: 3, title: "Attack", desc: "Sinakal ng entidad si Mark sa gitna ng kadiliman." },
          { ep: 4, s: 1, title: "Basement Escape", desc: "Pagtakas patungo sa lihim na basement kung saan naroon ang lumang altar." },
          { ep: 4, s: 2, title: "Counter Ritual", desc: "Pagsisimula ng kontra-ritwal gamit ang itinagong kuwentas." },
          { ep: 4, s: 3, title: "True Entity", desc: "Nagbagong-anyo ang entidad bilang isang nakakatakot na nilalang." },
          { ep: 5, s: 1, title: "The Last Stand", desc: "Labanan sa gitna ng altar gamit ang nahawakang ilaw at krus." },
          { ep: 5, s: 2, title: "Soul Release", desc: "Nagpakita ang tunay na kaluluwa ni Clara para gabayan si Mark." },
          { ep: 5, s: 3, title: "Dawn Breakdown", desc: "Sumikat ang araw, nawala ang sumpa, at naiwan ang katahimikan." }
        ]
      }
    ];

    function openGenreModal() { document.getElementById('genreModal').classList.remove('hidden'); }
    function closeGenreModal() { document.getElementById('genreModal').classList.add('hidden'); }

    function runGenre() {
      closeGenreModal();
      const container = document.getElementById('conceptsContainer');
      container.innerHTML = horrorConcepts.map(c => `
        <div class="p-3 bg-[#131B2E] border border-slate-800 rounded-xl">
          <div class="flex justify-between items-start mb-1">
            <h4 class="text-xs font-bold text-white">${c.id}. ${c.title}</h4>
            <span class="text-[9px] bg-slate-800 text-blue-400 px-1.5 py-0.5 rounded">${c.tag}</span>
          </div>
          <p class="text-[10px] text-slate-300 leading-snug mb-2.5">${c.desc}</p>
          <button onclick="goToPhase2(${c.id})" class="w-full py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-[10px] font-semibold transition">Piliin ang Concept #${c.id}</button>
        </div>
      `).join('');
      document.getElementById('storyConceptsView').classList.remove('hidden');
    }

    function goToPhase2(id) {
      activeStory = horrorConcepts.find(c => c.id === id);
      const container = document.getElementById('phase2Content');
      
      let rows = activeStory.roadmap.map(r => `
        <tr class="border-b border-slate-800 text-[9px]">
          <td class="p-1.5 font-bold text-blue-400">Ep ${r.ep}</td>
          <td class="p-1.5 text-slate-200">${r.title}</td>
          <td class="p-1.5 text-slate-400">${r.rev}</td>
          <td class="p-1.5 text-red-400 font-medium">${r.cliff}</td>
        </tr>
      `).join('');

      container.innerHTML = `
        <div class="bg-purple-950/30 border border-purple-800/40 rounded-xl p-3">
          <h2 class="text-xs font-bold text-purple-300 mb-1">📖 MASTER STORY BIBLE: ${activeStory.title.toUpperCase()}</h2>
          <p class="text-[10px] text-slate-300"><b>Logline:</b> ${activeStory.logline}</p>
        </div>
        <div class="bg-[#131B2E] border border-slate-800 rounded-xl p-3 space-y-2">
          <p class="text-slate-300"><b>Premise:</b> ${activeStory.premise}</p>
          <p class="text-slate-300"><b>Central Mystery:</b> ${activeStory.mystery}</p>
        </div>
        <div class="bg-[#131B2E] border border-slate-800 rounded-xl p-3">
          <h3 class="text-[11px] font-bold text-white mb-2">5-Episode Roadmap</h3>
          <table class="w-full text-left border-collapse">
            <thead><tr class="border-b border-slate-700 text-[9px] text-slate-400"><th class="p-1">Ep</th><th class="p-1">Title</th><th class="p-1">Revelation</th><th class="p-1">Cliffhanger</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <div class="p-2 bg-slate-900 border border-slate-800 rounded-lg font-mono text-[9px] text-purple-300">
          <p class="font-bold text-blue-400 mb-1">Ref ID: ${activeStory.charName}</p>
          <p class="text-slate-300">${activeStory.charPrompt}</p>
        </div>
        <button onclick="goToPhase3()" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white text-xs font-semibold shadow-lg transition">🔒 Proceed to Phase 3</button>
      `;

      document.getElementById('storyConceptsView').classList.add('hidden');
      document.getElementById('phase2View').classList.remove('hidden');
    }

    function goToPhase3() {
      const container = document.getElementById('phase3Content');
      container.innerHTML = `
        <div class="bg-indigo-950/30 border border-indigo-800/40 rounded-xl p-3">
          <h2 class="text-xs font-bold text-indigo-300 mb-1">🎬 PHASE 3: EPISODE & SCENE BREAKDOWN</h2>
          <p class="text-[10px] text-slate-300">3 Scenes per Episode • Total of 15 Scenes (90s per Ep)</p>
        </div>
        <div class="bg-[#131B2E] border border-slate-800 rounded-xl p-3 space-y-3">
          ${activeStory.roadmap.map(ep => `
            <div class="border-b border-slate-800 pb-2">
              <h4 class="font-bold text-blue-400 text-[11px]">Episode ${ep.ep}: ${ep.title}</h4>
              ${activeStory.scenes.filter(s => s.ep === ep.ep).map(s => `
                <p class="text-[10px] text-slate-300 mt-1"><b>Scene ${s.s}:</b> ${s.title} - ${s.desc}</p>
              `).join('')}
            </div>
          `).join('')}
        </div>
        <button onclick="goToPhase4()" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-indigo-600 to-blue-600 text-white text-xs font-semibold shadow-lg transition">🎬 Proceed to Phase 4: Full Scripts & Image Prompts</button>
      `;

      document.getElementById('phase2View').classList.add('hidden');
      document.getElementById('phase3View').classList.remove('hidden');
    }

    function goToPhase4() {
      const container = document.getElementById('phase4Content');
      container.innerHTML = `
        <div class="bg-emerald-950/30 border border-emerald-800/40 rounded-xl p-3">
          <h2 class="text-xs font-bold text-emerald-300 mb-1">📝 PHASE 4: FULL SCRIPTS & AI PROMPTS</h2>
          <p class="text-[10px] text-slate-300">Generated Video Prompts & Audio Scripts for all 15 scenes</p>
        </div>
        <div class="bg-[#131B2E] border border-slate-800 rounded-xl p-3 space-y-3">
          <h4 class="font-bold text-emerald-400">Sample Visual Prompt (Ep 1 - Scene 1):</h4>
          <div class="p-2 bg-slate-900 rounded font-mono text-[9px] text-slate-300">
            Close up shot of smartphone in dark room, screen glowing with live broadcast notification, character ref ${activeStory.charName}, dark horror aesthetic, photorealistic, 9:16 vertical --v 6.0
          </div>
          <h4 class="font-bold text-emerald-400">Sample Voiceover Script:</h4>
          <p class="italic text-slate-300 text-[10px]">"Inakala kong tapos na ang lahat... pero bakit tumatawag ka pa rin?"</p>
        </div>
        <button onclick="goToPhase5()" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 text-white text-xs font-semibold shadow-lg transition">🚀 Proceed to Phase 5: Complete Series Compile & Download</button>
      `;

      document.getElementById('phase3View').classList.add('hidden');
      document.getElementById('phase4View').classList.remove('hidden');
    }

    function goToPhase5() {
      const container = document.getElementById('phase5Content');

      let compiledScenesHTML = activeStory.scenes.map(s => `
        <div class="p-2 bg-slate-900 border border-slate-800 rounded-lg">
          <div class="flex justify-between items-center mb-1">
            <span class="font-bold text-amber-400 text-[10px]">EP ${s.ep} • SCENE ${s.s}</span>
            <span class="text-[9px] bg-slate-800 text-slate-400 px-1 py-0.5 rounded">30 SECONDS</span>
          </div>
          <h5 class="text-white font-bold text-[10px]">${s.title}</h5>
          <p class="text-slate-400 text-[9px] mt-0.5">${s.desc}</p>
        </div>
      `).join('');

      container.innerHTML = `
        <div class="bg-amber-950/30 border border-amber-800/40 rounded-xl p-3">
          <h2 class="text-xs font-bold text-amber-300 mb-1">🚀 PHASE 5: COMPILED SHORT FILM SERIES</h2>
          <p class="text-[10px] text-slate-300">Kumpletong 15 Scenes (5 Episodes) • Ready for Download</p>
        </div>

        <div id="downloadBox" class="bg-[#131B2E] border border-slate-800 rounded-xl p-3 space-y-2">
          <h3 class="font-bold text-white text-[11px] mb-1">🎬 Download Full Series Render</h3>
          <p class="text-slate-400 text-[10px]">Pumili ng resolusyon para ma-download ang compiled video file:</p>
          <div class="grid grid-cols-2 gap-2 pt-1">
            <button onclick="triggerDownload('720p')" class="py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-[10px] font-bold flex items-center justify-center gap-1">
              <span>⬇</span> Download 720p (HD)
            </button>
            <button onclick="triggerDownload('1080p')" class="py-2 rounded-lg bg-amber-600 hover:bg-amber-500 text-white text-[10px] font-bold flex items-center justify-center gap-1">
              <span>⬇</span> Download 1080p (FHD)
            </button>
          </div>
          <p id="downloadStatus" class="hidden text-center text-[10px] text-amber-400 font-semibold pt-1"></p>
        </div>

        <div class="bg-[#131B2E] border border-slate-800 rounded-xl p-3 space-y-2">
          <h3 class="font-bold text-white text-[11px] mb-2">📜 All Compiled Scenes (Episodes 1 - 5)</h3>
          <div class="space-y-2 max-h-[220px] overflow-y-auto no-scrollbar pr-1">
            ${compiledScenesHTML}
          </div>
        </div>

        <button onclick="backToDashboard()" class="w-full py-2.5 rounded-xl bg-slate-800 border border-slate-700 hover:bg-slate-700 text-white text-xs font-semibold transition">🏠 Return to Main Dashboard</button>
      `;

      document.getElementById('phase4View').classList.add('hidden');
      document.getElementById('phase5View').classList.remove('hidden');
    }

    function triggerDownload(quality) {
      const status = document.getElementById('downloadStatus');
      status.classList.remove('hidden');
      status.innerText = `⏳ Preparing ${quality} video export for "${activeStory.title}"...`;

      setTimeout(() => {
        status.innerText = `✅ Success! Downloading "${activeStory.title}_FullSeries_${quality}.mp4"`;
        
        // Simulating direct browser download file
        const blob = new Blob([`Dummy MP4 Video Data for ${activeStory.title}`], { type: 'video/mp4' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${activeStory.title.replace(/\s+/g, '_')}_Series_${quality}.mp4`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
      }, 1500);
    }

    function backToDashboard() {
      document.getElementById('storyConceptsView').classList.add('hidden');
      document.getElementById('phase5View').classList.add('hidden');
      document.getElementById('mainDashboard').classList.remove('hidden');
    }
    function backToConcepts() {
      document.getElementById('phase2View').classList.add('hidden');
      document.getElementById('storyConceptsView').classList.remove('hidden');
    }
    function backToPhase2() {
      document.getElementById('phase3View').classList.add('hidden');
      document.getElementById('phase2View').classList.remove('hidden');
    }
    function backToPhase3() {
      document.getElementById('phase4View').classList.add('hidden');
      document.getElementById('phase3View').classList.remove('hidden');
    }
    function backToPhase4() {
      document.getElementById('phase5View').classList.add('hidden');
      document.getElementById('phase4View').classList.remove('hidden');
    }
  </script>
